apiVersion: batch/v1
kind: Job
metadata:
  name: kadence-forecaster-smoke
  namespace: NAMESPACE
  labels:
    app: kadence-forecaster
    purpose: smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: kadence-forecaster
        purpose: smoke
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-L40S, NVIDIA-L40]
            - weight: 80
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-PCIE-40GB, NVIDIA-A100-SXM4-40GB]
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp:latest
          workingDir: /home/jovyan/kadence
          command: ["/bin/bash", "-lc"]
          args:
            - >-
              set -euo pipefail;
              nvidia-smi;
              python3 experiments/forecasting/train_forecaster.py --require-gpu --quick
              --max-tasks 400 --backbones tcn --datasets google alibaba
              --out results/forecaster_smoke.json;
              test -s results/forecaster_smoke.json;
              echo SMOKE_OK
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - name: kadence-vol
              mountPath: /home/jovyan
      volumes:
        - name: kadence-vol
          persistentVolumeClaim:
            claimName: kadence-vol
